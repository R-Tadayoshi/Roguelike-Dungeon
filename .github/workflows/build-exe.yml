# Builds dist/Roguelike.exe on Windows whenever the game's code changes, and
# commits it back to the same branch so a `git pull` brings the new version.
name: Build Windows exe

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest

      # jinxed loads its terminal definitions by name at runtime, so PyInstaller
      # can't see them on its own; --collect-submodules bundles them all.
      - name: Build exe
        run: >
          pyinstaller main.py --onefile --console --name Roguelike
          --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          --collect-submodules jinxed --collect-submodules blessed --collect-submodules wcwidth

      - name: Check the exe starts
        run: |
          dist\Roguelike.exe --help
          dist\Roguelike.exe --check

      - uses: actions/upload-artifact@v4
        with:
          name: Roguelike-exe
          path: dist/Roguelike.exe

      - name: Commit the exe to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Roguelike.exe
          if git diff --cached --quiet; then
            echo "exe unchanged"
          else
            git commit -m "Build Roguelike.exe from ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
